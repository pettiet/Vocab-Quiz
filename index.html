<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCAB QUEST :: A Retro Vocabulary Challenge</title>

<!-- Pixel + Retro display fonts, plus a readable body font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Retro-arcade palette: hot pink, electric cyan, gold, deep purple */
    --bg-deep: #1a0033;
    --bg-mid: #2d0a4e;
    --neon-pink: #ff2e93;
    --neon-cyan: #00f0ff;
    --neon-yellow: #ffd60a;
    --neon-green: #39ff14;
    --neon-red: #ff3860;
    --paper: #fff8e7;
    --ink: #1a0033;
    --ink-soft: #4a2a6d;
    --grid-line: rgba(0, 240, 255, 0.08);

    --font-display: 'Press Start 2P', monospace;
    --font-retro: 'VT323', monospace;
    --font-body: 'Outfit', sans-serif;
  }

  html, body {
    overscroll-behavior: none;
  }

  body {
    font-family: var(--font-body);
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(ellipse at top, #4a1a7a 0%, var(--bg-deep) 60%),
      var(--bg-deep);
    background-attachment: fixed;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* Animated background grid - subtle perspective effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    animation: gridDrift 20s linear infinite;
  }

  @keyframes gridDrift {
    from { transform: translate(0, 0); }
    to { transform: translate(40px, 40px); }
  }

  /* Floating sparkles */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255, 255, 255, 0.3), transparent),
      radial-gradient(1px 1px at 80% 10%, rgba(0, 240, 255, 0.5), transparent),
      radial-gradient(2px 2px at 60% 70%, rgba(255, 46, 147, 0.3), transparent),
      radial-gradient(1px 1px at 90% 50%, rgba(255, 214, 10, 0.5), transparent),
      radial-gradient(2px 2px at 33% 85%, rgba(57, 255, 20, 0.3), transparent);
    background-size: 250px 250px;
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* The main quiz container - chunky retro card */
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    margin: 16px 0;
  }

  .card {
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 8px;
    box-shadow:
      8px 8px 0 var(--neon-pink),
      8px 8px 0 4px var(--ink);
    position: relative;
    overflow: hidden;
  }

  /* Header with marquee feel */
  .header {
    background:
      repeating-linear-gradient(
        90deg,
        var(--bg-deep) 0,
        var(--bg-deep) 20px,
        #2d0a4e 20px,
        #2d0a4e 40px
      );
    color: var(--paper);
    padding: 20px 24px;
    border-bottom: 4px solid var(--ink);
    position: relative;
  }

  .header::after {
    /* Scanline overlay */
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: clamp(0.95rem, 3vw, 1.4rem);
    line-height: 1.4;
    margin-bottom: 8px;
    color: var(--neon-yellow);
    text-shadow:
      2px 2px 0 var(--neon-pink),
      4px 4px 0 var(--ink);
    letter-spacing: 0.05em;
  }

  .header-sub {
    font-family: var(--font-retro);
    font-size: 1.25rem;
    color: var(--neon-cyan);
    letter-spacing: 0.08em;
    text-shadow: 1px 1px 0 var(--ink);
  }

  .progress-track {
    margin-top: 14px;
    height: 14px;
    background: var(--ink);
    border: 2px solid var(--paper);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--neon-pink) 0%, var(--neon-yellow) 50%, var(--neon-green) 100%);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .progress-fill::after {
    /* Glow on the leading edge */
    content: '';
    position: absolute;
    right: 0;
    top: -2px;
    bottom: -2px;
    width: 8px;
    background: var(--paper);
    box-shadow: 0 0 12px var(--paper);
  }

  .progress-text {
    font-family: var(--font-retro);
    font-size: 1.1rem;
    color: var(--paper);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  /* Main content area */
  .content {
    padding: 32px 28px;
    background: var(--paper);
    position: relative;
    min-height: 360px;
  }

  /* Paper texture overlay */
  .content::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(26, 0, 51, 0.04) 1px, transparent 0);
    background-size: 18px 18px;
    pointer-events: none;
  }

  .content > * {
    position: relative;
    z-index: 1;
  }

  /* === START SCREEN === */
  .start-screen {
    text-align: center;
    padding: 24px 0;
  }

  .start-screen .hero-art {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    display: block;
  }

  .start-screen h2 {
    font-family: var(--font-display);
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .start-screen .tagline {
    font-family: var(--font-retro);
    font-size: 1.3rem;
    color: var(--ink-soft);
    margin-bottom: 24px;
    letter-spacing: 0.04em;
  }

  .stat-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 24px 0;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--bg-deep);
    color: var(--neon-yellow);
    border: 3px solid var(--ink);
    padding: 14px 22px;
    min-width: 110px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .stat-number {
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: var(--neon-yellow);
    text-shadow: 2px 2px 0 var(--neon-pink);
  }

  .stat-label {
    font-family: var(--font-retro);
    font-size: 1rem;
    color: var(--neon-cyan);
    margin-top: 6px;
    letter-spacing: 0.06em;
  }

  /* === QUESTION SCREEN === */
  .question-area {
    animation: fadeInUp 0.4s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    font-family: var(--font-display);
    font-size: 0.7rem;
    color: var(--neon-pink);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .question {
    font-family: var(--font-body);
    font-size: clamp(1.1rem, 2.8vw, 1.3rem);
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 28px;
    color: var(--ink);
  }

  .blank {
    display: inline-block;
    min-width: 90px;
    border-bottom: 3px solid var(--neon-pink);
    margin: 0 4px;
    text-align: center;
    font-weight: 700;
    color: var(--neon-pink);
  }

  /* Combo/streak indicator */
  .combo-badge {
    display: inline-block;
    font-family: var(--font-display);
    font-size: 0.65rem;
    background: var(--neon-yellow);
    color: var(--ink);
    padding: 4px 8px;
    border: 2px solid var(--ink);
    margin-left: 8px;
    box-shadow: 2px 2px 0 var(--ink);
    animation: comboPop 0.3s ease;
  }

  @keyframes comboPop {
    0% { transform: scale(0.5); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 4px;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: 500;
    text-align: left;
    font-family: var(--font-body);
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  /* Hover styles ONLY on devices that actually hover (desktop).
     This fixes the iPhone sticky-hover bug where the next question
     would render with one button looking pre-selected. */
  @media (hover: hover) {
    .option:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--neon-pink), 6px 6px 0 3px var(--ink);
      background: #fff;
    }
  }

  .option:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .option-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: var(--bg-deep);
    color: var(--neon-yellow);
    border: 2px solid var(--ink);
    font-family: var(--font-display);
    font-size: 0.75rem;
    flex-shrink: 0;
  }

  .option.correct {
    background: var(--neon-green);
    color: var(--ink);
    border-color: var(--ink);
    animation: correctPulse 0.5s ease;
  }

  .option.correct .option-letter {
    background: var(--ink);
    color: var(--neon-green);
  }

  @keyframes correctPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .option.wrong {
    background: var(--neon-red);
    color: var(--paper);
    border-color: var(--ink);
    animation: wrongShake 0.5s ease;
  }

  .option.wrong .option-letter {
    background: var(--ink);
    color: var(--neon-red);
  }

  @keyframes wrongShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .option:disabled {
    cursor: not-allowed;
  }

  /* === DEFINITION PANEL (shown on wrong answer) === */
  .definition-panel {
    margin-top: 24px;
    background: var(--bg-deep);
    color: var(--paper);
    border: 4px solid var(--ink);
    padding: 20px;
    box-shadow: 6px 6px 0 var(--neon-cyan), 6px 6px 0 4px var(--ink);
    animation: slideInPanel 0.4s ease;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  @keyframes slideInPanel {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .definition-panel .panel-art {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
  }

  .definition-panel .panel-body {
    flex: 1;
    min-width: 0;
  }

  .definition-word {
    font-family: var(--font-display);
    font-size: 0.9rem;
    color: var(--neon-yellow);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 var(--ink);
  }

  .definition-text {
    font-family: var(--font-retro);
    font-size: 1.25rem;
    line-height: 1.4;
    color: var(--paper);
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }

  .next-btn {
    background: var(--neon-yellow);
    color: var(--ink);
    border: 3px solid var(--ink);
    padding: 10px 22px;
    font-family: var(--font-display);
    font-size: 0.7rem;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.05em;
    -webkit-tap-highlight-color: transparent;
  }

  @media (hover: hover) {
    .next-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--ink);
      background: #fff;
    }
  }

  .next-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  /* === START / RESTART button === */
  .start-btn {
    background: var(--neon-pink);
    color: var(--paper);
    border: 4px solid var(--ink);
    padding: 16px 36px;
    font-family: var(--font-display);
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 6px 6px 0 var(--ink);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    letter-spacing: 0.08em;
    margin-top: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  @media (hover: hover) {
    .start-btn:hover {
      transform: translate(-3px, -3px) rotate(-1deg);
      box-shadow: 9px 9px 0 var(--neon-yellow), 9px 9px 0 4px var(--ink);
    }
  }

  .start-btn:active {
    transform: translate(3px, 3px);
    box-shadow: 3px 3px 0 var(--ink);
  }

  /* === RESULTS SCREEN === */
  .results {
    text-align: center;
    padding: 16px 0;
  }

  .results-art {
    width: 160px;
    height: 160px;
    margin: 0 auto 16px;
  }

  .score-display {
    margin-bottom: 20px;
  }

  .score-percent {
    font-family: var(--font-display);
    font-size: clamp(2rem, 8vw, 3.5rem);
    color: var(--neon-pink);
    text-shadow:
      3px 3px 0 var(--ink),
      6px 6px 0 var(--neon-yellow);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .score-fraction {
    font-family: var(--font-retro);
    font-size: 1.6rem;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
  }

  .grade-label {
    font-family: var(--font-display);
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    color: var(--ink);
    margin-top: 16px;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .grade-message {
    font-family: var(--font-retro);
    font-size: 1.3rem;
    color: var(--ink-soft);
    margin-bottom: 24px;
    letter-spacing: 0.03em;
  }

  .perfect-message {
    background: var(--neon-green);
    border: 4px solid var(--ink);
    color: var(--ink);
    padding: 18px;
    font-family: var(--font-display);
    font-size: 0.8rem;
    line-height: 1.6;
    box-shadow: 6px 6px 0 var(--ink);
    margin-top: 20px;
  }

  /* Review section */
  .review-section {
    margin-top: 32px;
    text-align: left;
  }

  .review-section h3 {
    font-family: var(--font-display);
    font-size: 0.85rem;
    color: var(--ink);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .review-item {
    background: #fff;
    border: 3px solid var(--ink);
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 4px 4px 0 var(--neon-red), 4px 4px 0 3px var(--ink);
  }

  .review-word {
    display: inline-block;
    background: var(--bg-deep);
    color: var(--neon-yellow);
    padding: 4px 10px;
    font-family: var(--font-display);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    border: 2px solid var(--ink);
  }

  .review-question {
    font-family: var(--font-body);
    font-size: 1rem;
    margin-bottom: 10px;
    line-height: 1.5;
    color: var(--ink);
  }

  .review-answer {
    font-family: var(--font-body);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  .review-answer.your-answer {
    color: var(--neon-red);
  }

  .review-answer.correct-answer {
    color: #1d8e3a;
    font-weight: 600;
  }

  .review-answer .label {
    font-weight: 700;
    color: var(--ink-soft);
    margin-right: 6px;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }

  .review-definition {
    font-family: var(--font-retro);
    font-size: 1.15rem;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 2px dashed var(--ink-soft);
    color: var(--ink);
    line-height: 1.4;
  }

  .review-definition .label {
    font-family: var(--font-body);
    font-weight: 700;
    color: var(--neon-pink);
    margin-right: 6px;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
  }

  /* === CONFETTI (correct-answer celebration) === */
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 10px;
    height: 14px;
    top: -20px;
    animation: confettiFall 1.4s ease-out forwards;
  }

  @keyframes confettiFall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(100vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* === SHAKE the whole card on wrong answer === */
  .card.shake {
    animation: cardShake 0.5s ease;
  }

  @keyframes cardShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  /* === FLASH overlay on correct (subtle green pulse) === */
  .flash-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    animation: flashGreen 0.6s ease-out forwards;
  }

  .flash-overlay.wrong {
    animation: flashRed 0.6s ease-out forwards;
  }

  @keyframes flashGreen {
    0% { background: rgba(57, 255, 20, 0.4); }
    100% { background: rgba(57, 255, 20, 0); }
  }

  @keyframes flashRed {
    0% { background: rgba(255, 56, 96, 0.35); }
    100% { background: rgba(255, 56, 96, 0); }
  }

  /* === GIANT REACTION POPUP === */
  .reaction-popup {
    position: fixed;
    /* Position high up so it doesn't overlap the definition panel that
       appears below the answer options on wrong answers. */
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 101;
    pointer-events: none;
    animation: reactionPop 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  @keyframes reactionPop {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-15deg); opacity: 1; }
    20% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); opacity: 1; }
    40% { transform: translate(-50%, -50%) scale(0.95) rotate(-2deg); opacity: 1; }
    60% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); opacity: 0; }
  }

  .reaction-popup svg {
    width: 160px;
    height: 160px;
    filter: drop-shadow(6px 6px 0 var(--ink));
    display: block;
  }

  /* Text sits in a big chunky banner below the icon. */
  .reaction-text {
    font-family: var(--font-display);
    font-size: 1.5rem;
    color: var(--neon-yellow);
    background: var(--bg-deep);
    padding: 14px 28px;
    border: 4px solid var(--ink);
    box-shadow: 6px 6px 0 var(--neon-pink), 6px 6px 0 4px var(--ink);
    letter-spacing: 0.1em;
    white-space: nowrap;
    text-align: center;
  }

  .reaction-text.wrong-text {
    color: var(--neon-red);
    box-shadow: 6px 6px 0 var(--neon-yellow), 6px 6px 0 4px var(--ink);
  }

  /* === Mobile tweaks === */
  @media (max-width: 600px) {
    body { padding: 8px; }
    .card { box-shadow: 5px 5px 0 var(--neon-pink), 5px 5px 0 3px var(--ink); }
    .header { padding: 16px 18px; }
    .content { padding: 22px 18px; }
    .option { padding: 12px 14px; font-size: 1rem; box-shadow: 3px 3px 0 var(--ink); }
    .definition-panel { padding: 16px; gap: 12px; box-shadow: 4px 4px 0 var(--neon-cyan), 4px 4px 0 3px var(--ink); }
    .definition-panel .panel-art { width: 56px; height: 56px; }
    .start-btn { padding: 14px 24px; font-size: 0.7rem; }
    /* Tighter start screen on mobile so the floppy + heading + button fit */
    .start-screen { padding: 8px 0; }
    .start-screen .hero-art { width: 110px; height: 110px; margin-bottom: 12px; }
    .start-screen h2 { font-size: 0.85rem; margin-bottom: 8px; }
    .start-screen .tagline { font-size: 1.1rem; margin-bottom: 14px; }
    .stat-row { margin: 14px 0; gap: 10px; }
    .stat { padding: 10px 16px; min-width: 80px; box-shadow: 3px 3px 0 var(--ink); }
    .stat-number { font-size: 1.1rem; }
    .stat-label { font-size: 0.85rem; }
    .reaction-popup { gap: 10px; top: 18%; }
    .reaction-popup svg { width: 110px; height: 110px; }
    .reaction-text { font-size: 1rem; padding: 10px 18px; box-shadow: 4px 4px 0 var(--neon-pink), 4px 4px 0 3px var(--ink); }
    .reaction-text.wrong-text { box-shadow: 4px 4px 0 var(--neon-yellow), 4px 4px 0 3px var(--ink); }
  }

  /* === BADGE SYSTEM === */
  .badge-tray {
    background: var(--ink);
    border-bottom: 4px solid var(--neon-pink);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 56px;
    overflow-x: auto;
    overflow-y: hidden;
    /* Hide scrollbar but keep scroll functional */
    scrollbar-width: thin;
    scrollbar-color: var(--neon-pink) transparent;
  }

  .badge-tray::-webkit-scrollbar { height: 4px; }
  .badge-tray::-webkit-scrollbar-track { background: transparent; }
  .badge-tray::-webkit-scrollbar-thumb { background: var(--neon-pink); }

  .badge-tray-label {
    font-family: var(--font-display);
    font-size: 0.55rem;
    color: var(--neon-cyan);
    letter-spacing: 0.08em;
    flex-shrink: 0;
    margin-right: 4px;
    white-space: nowrap;
  }

  .badge-tray-empty {
    font-family: var(--font-retro);
    font-size: 1rem;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.04em;
  }

  .badge-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border: 2px solid var(--neon-pink);
    background: var(--bg-deep);
    cursor: help;
    transition: transform 0.15s ease;
    position: relative;
    animation: badgeAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes badgeAppear {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(0deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  @media (hover: hover) {
    .badge-icon:hover {
      transform: scale(1.15);
      z-index: 5;
    }
  }

  .badge-icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Tooltip on hover */
  .badge-icon::after {
    content: attr(data-name);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--neon-yellow);
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 0.55rem;
    padding: 4px 8px;
    white-space: nowrap;
    border: 2px solid var(--ink);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }

  @media (hover: hover) {
    .badge-icon:hover::after {
      opacity: 1;
    }
  }

  /* === BADGE UNLOCK NOTIFICATION === */
  .badge-notification {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-deep);
    border: 4px solid var(--neon-yellow);
    box-shadow: 8px 8px 0 var(--neon-pink), 8px 8px 0 4px var(--ink);
    padding: 24px 32px;
    z-index: 102;
    text-align: center;
    pointer-events: none;
    animation: badgeUnlock 2.2s ease forwards;
    max-width: 90vw;
  }

  /* For badges with longer descriptions, give the reader more time */
  .badge-notification.long-desc {
    animation: badgeUnlockLong 4s ease forwards;
  }

  @keyframes badgeUnlock {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.1) rotate(3deg); opacity: 1; }
    25% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9) translateY(-40px); opacity: 0; }
  }

  @keyframes badgeUnlockLong {
    0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
    8% { transform: translate(-50%, -50%) scale(1.1) rotate(3deg); opacity: 1; }
    14% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    88% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9) translateY(-40px); opacity: 0; }
  }

  .badge-notification .unlock-label {
    font-family: var(--font-display);
    font-size: 0.7rem;
    color: var(--neon-cyan);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }

  .badge-notification .unlock-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 14px;
    border: 3px solid var(--neon-pink);
  }

  .badge-notification .unlock-name {
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--neon-yellow);
    text-shadow: 2px 2px 0 var(--ink);
    line-height: 1.3;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .badge-notification .unlock-desc {
    font-family: var(--font-retro);
    font-size: 1.1rem;
    color: var(--paper);
    letter-spacing: 0.04em;
    line-height: 1.4;
    max-width: 320px;
  }

  /* Mobile tweaks for badges */
  @media (max-width: 600px) {
    .badge-tray { padding: 8px 12px; min-height: 48px; gap: 6px; }
    .badge-tray-label { font-size: 0.5rem; }
    .badge-icon { width: 32px; height: 32px; }
    .badge-notification { padding: 18px 22px; }
    .badge-notification .unlock-icon { width: 60px; height: 60px; }
    .badge-notification .unlock-name { font-size: 0.8rem; }
    .badge-notification .unlock-desc { font-size: 1rem; }
  }

  /* === BADGE SUMMARY (on results screen) === */
  .badge-summary {
    margin-top: 28px;
    text-align: left;
  }

  .badge-summary h3 {
    font-family: var(--font-display);
    font-size: 0.85rem;
    color: var(--ink);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .badge-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }

  .badge-summary-item {
    background: var(--bg-deep);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--neon-yellow), 4px 4px 0 3px var(--ink);
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-summary-icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border: 2px solid var(--neon-pink);
  }

  .badge-summary-icon svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .badge-summary-text {
    flex: 1;
    min-width: 0;
  }

  .badge-summary-name {
    font-family: var(--font-display);
    font-size: 0.6rem;
    color: var(--neon-yellow);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .badge-summary-desc {
    font-family: var(--font-retro);
    font-size: 1rem;
    color: var(--paper);
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  /* Reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

    desc: '5 correct answers in a row without a miss',
    check: (s) => s.streak >= 5
  },
  {
    id: 'on-fire',
    name: 'ON FIRE',
    desc: '10 correct answers in a row — you are cooking',
    check: (s) => s.streak >= 10
  },
  {
    id: 'unstoppable',
    name: 'UNSTOPPABLE',
    desc: '15 correct in a row — nothing can stop you now',
    check: (s) => s.streak >= 15
  },
  {
    id: 'flawless',
    name: 'FLAWLESS',
    desc: '25 correct answers in a row — absolutely elite',
    check: (s) => s.streak >= 25
  },
  {
    id: 'speed-demon',
    name: 'SPEED DEMON',
    desc: 'Answered a question correctly in under 3 seconds — quick draw!',
    check: (s, ctx) => ctx.justCorrect && ctx.answerTime < 3000
  },
  {
    id: 'comeback',
    name: 'COMEBACK KID',
    desc: 'Got 3 right in a row after missing one — bounced back strong',
    check: (s) => s.hadAWrongAnswer && s.correctAfterWrong >= 3
  },
  {
    id: 'halfway',
    name: 'HALFWAY THERE',
    desc: 'Made it to question 32 — halfway through the quiz!',
    check: (s) => s.currentIndex >= 32
  },
  {
    id: 'literary-scholar',
    name: 'LITERARY SCHOLAR',
    desc: 'Got all 7 literary device questions right: allusion, parallelism, juxtaposition, euphemism, oxymoron, anaphora, and epistrophe',
    check: (s) => s.literaryCorrect >= 7 && s.literaryAttempted >= 7
  },
  {
    id: 'survivor',
    name: 'SURVIVOR',
    desc: 'Finished all 64 questions — you went the distance',
    check: (s, ctx) => ctx.quizComplete
  },
  {
    id: 'bookworm',
    name: 'BOOKWORM',
    desc: 'Finished with 80% or higher — strong vocabulary skills',
    check: (s, ctx) => ctx.quizComplete && (s.score / s.questions.length) >= 0.8
  },
  {
    id: 'master',
    name: 'VOCAB MASTER',
    desc: 'Finished with 90% or higher — you really know these words',
    check: (s, ctx) => ctx.quizComplete && (s.score / s.questions.length) >= 0.9
  },
  {
    id: 'perfect',
    name: 'PERFECT SCORE',
    desc: 'Got every single one of the 64 questions right — flawless victory',
    check: (s, ctx) => ctx.quizComplete && s.score === s.questions.length
  }
];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function matchCase(template, replacement) {
  if (template.length > 0 && template[0] === template[0].toUpperCase() && template[0] !== template[0].toLowerCase()) {
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement.toLowerCase();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// =============================================
// BUILD QUIZ
// =============================================
function buildQuiz() {
  const selected = ENCODED_BANK.map(entry => {
    const versionIndex = Math.floor(Math.random() * entry.q.length);
    const q = entry.q[versionIndex];

    const decodedSentence = d(q.s);
    const decodedCorrect = d(q.c);
    const decodedOptions = q.o.map(o => d(o));
    const decodedDefinition = entry.d ? d(entry.d) : '';

    const shuffledOptions = shuffleArray(decodedOptions);

    return {
      word: entry.w,
      definition: decodedDefinition,
      sentence: decodedSentence,
      options: shuffledOptions,
      correctAnswer: decodedCorrect
    };
  });

  quizState.questions = shuffleArray(selected);
  quizState.currentIndex = 0;
  quizState.score = 0;
  quizState.streak = 0;
  quizState.maxStreak = 0;
  quizState.wrongAnswers = [];
  quizState.earnedBadges = [];
  quizState.correctAfterWrong = 0;
  quizState.hadAWrongAnswer = false;
  quizState.literaryCorrect = 0;
  quizState.literaryAttempted = 0;

  // Reset badge tray UI
  renderBadgeTray();
}

// =============================================
// START SCREEN
// =============================================
function renderStartScreen() {
  document.getElementById('header-sub').textContent = 'READY PLAYER ONE';
  document.getElementById('progress-text').innerHTML = '&gt; INSERT COIN TO BEGIN';
  document.getElementById('progress-fill').style.width = '0%';

  // Reset badge tray to empty state
  quizState.earnedBadges = [];
  renderBadgeTray();

  document.getElementById('content').innerHTML = `
    <div class="start-screen">
      <svg class="hero-art" aria-hidden="true"><use href="#art-floppy"/></svg>
      <h2>TEST YOUR VOCAB SKILLS</h2>
      <div class="tagline">One word per question. Pick wisely.</div>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-number">${ENCODED_BANK.length}</div>
          <div class="stat-label">WORDS</div>
        </div>
        <div class="stat">
          <div class="stat-number">4</div>
          <div class="stat-label">CHOICES</div>
        </div>
      </div>
      <button class="start-btn" onclick="startQuiz()">▶ PRESS START</button>
    </div>
  `;
}

function startQuiz() {
  buildQuiz();
  renderQuestion();
}

// =============================================
// RENDER QUESTION
// =============================================
function renderQuestion() {
  const q = quizState.questions[quizState.currentIndex];
  const total = quizState.questions.length;
  const progress = (quizState.currentIndex / total) * 100;

  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('progress-text').innerHTML =
    `&gt; QUESTION ${quizState.currentIndex + 1} / ${total}`;

  const streakBadge = quizState.streak >= 3
    ? `<span class="combo-badge">🔥 ${quizState.streak} COMBO</span>`
    : '';

  document.getElementById('header-sub').innerHTML =
    `SCORE: ${quizState.score} / ${quizState.currentIndex}${streakBadge}`;

  const container = document.createElement('div');
  container.className = 'question-area';

  const qNum = document.createElement('div');
  qNum.className = 'q-number';
  qNum.textContent = `▸ Question ${quizState.currentIndex + 1}`;
  container.appendChild(qNum);

  const sentenceDiv = document.createElement('div');
  sentenceDiv.className = 'question';
  sentenceDiv.innerHTML = escapeHtml(q.sentence).replace('___', '<span class="blank">_____</span>');
  container.appendChild(sentenceDiv);

  const optionsDiv = document.createElement('div');
  optionsDiv.className = 'options';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    const displayOpt = matchCase(q.correctAnswer, opt);

    const letterSpan = document.createElement('span');
    letterSpan.className = 'option-letter';
    letterSpan.textContent = String.fromCharCode(65 + i);

    const textSpan = document.createElement('span');
    textSpan.className = 'option-text';
    textSpan.textContent = displayOpt;

    btn.appendChild(letterSpan);
    btn.appendChild(textSpan);
    btn.addEventListener('click', () => selectAnswer(btn, opt));
    // Blur on touchend to clear sticky :hover/:focus on mobile (iOS Safari)
    btn.addEventListener('touchend', () => btn.blur());

    optionsDiv.appendChild(btn);
  });

  container.appendChild(optionsDiv);

  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(container);

  // Record the start time for speed-demon badge tracking
  quizState.questionStartTime = Date.now();
}

// =============================================
// SELECT ANSWER + CELEBRATION/FEEDBACK
// =============================================
function selectAnswer(button, selectedOption) {
  const q = quizState.questions[quizState.currentIndex];
  const allButtons = document.querySelectorAll('.option');
  allButtons.forEach(b => b.disabled = true);

  const isCorrect = selectedOption.toLowerCase() === q.correctAnswer.toLowerCase();
  const answerTime = Date.now() - quizState.questionStartTime;
  const wordLower = q.correctAnswer.toLowerCase();
  const isLiterary = quizState.literaryWords.has(wordLower);

  if (isLiterary) {
    quizState.literaryAttempted++;
  }

  if (isCorrect) {
    button.classList.add('correct');
    quizState.score++;
    quizState.streak++;
    if (quizState.streak > quizState.maxStreak) quizState.maxStreak = quizState.streak;

    if (quizState.hadAWrongAnswer) {
      quizState.correctAfterWrong++;
    }
    if (isLiterary) {
      quizState.literaryCorrect++;
    }

    // CELEBRATE
    fireConfetti();
    flashScreen(false);
    showReaction(true);

    // Check for newly earned badges
    checkBadges({ justCorrect: true, answerTime });

    setTimeout(() => advanceQuestion(), 1300);
  } else {
    button.classList.add('wrong');
    quizState.streak = 0;
    quizState.correctAfterWrong = 0;
    quizState.hadAWrongAnswer = true;

    // SHAKE + FLASH
    const card = document.getElementById('card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 500);
    flashScreen(true);
    showReaction(false);

    // Highlight correct answer
    const correctDisplay = matchCase(q.correctAnswer, q.correctAnswer);
    allButtons.forEach(b => {
      const text = b.querySelector('.option-text').textContent;
      if (text === correctDisplay) {
        b.classList.add('correct');
      }
    });

    quizState.wrongAnswers.push({
      word: q.word,
      definition: q.definition,
      sentence: q.sentence,
      yourAnswer: matchCase(q.correctAnswer, selectedOption),
      correctAnswer: matchCase(q.correctAnswer, q.correctAnswer)
    });

    showDefinitionPanel(q);
  }
}

function advanceQuestion() {
  quizState.currentIndex++;

  // Check badges that depend on question index (e.g., halfway)
  checkBadges({ justCorrect: false });

  if (quizState.currentIndex >= quizState.questions.length) {
    renderResults();
  } else {
    renderQuestion();
  }
}

// =============================================
// BADGE SYSTEM
// =============================================
function checkBadges(ctx) {
  ctx = ctx || {};
  const newlyEarned = [];
  BADGES.forEach(badge => {
    if (quizState.earnedBadges.includes(badge.id)) return;
    if (badge.check(quizState, ctx)) {
      quizState.earnedBadges.push(badge.id);
      newlyEarned.push(badge);
    }
  });

  if (newlyEarned.length > 0) {
    renderBadgeTray();
    // Stagger the notifications if multiple badges earned at once.
    // Account for longer descriptions taking more time on screen.
    let cumulativeDelay = 0;
    newlyEarned.forEach((badge) => {
      const thisDelay = cumulativeDelay;
      setTimeout(() => showBadgeNotification(badge), thisDelay);
      cumulativeDelay += (badge.desc.length > 60) ? 4200 : 2400;
    });
  }
}

function renderBadgeTray() {
  const tray = document.getElementById('badge-tray');
  const empty = document.getElementById('badge-tray-empty');

  if (quizState.earnedBadges.length === 0) {
    empty.style.display = 'inline';
    // Remove all existing badge icons
    tray.querySelectorAll('.badge-icon').forEach(el => el.remove());
    return;
  }

  empty.style.display = 'none';

  // Add any badges not yet in the tray
  quizState.earnedBadges.forEach(id => {
    if (tray.querySelector(`.badge-icon[data-id="${id}"]`)) return; // already shown
    const badge = BADGES.find(b => b.id === id);
    if (!badge) return;

    const el = document.createElement('div');
    el.className = 'badge-icon';
    el.dataset.id = id;
    el.dataset.name = badge.name;
    el.title = badge.name + ' — ' + badge.desc;
    el.innerHTML = `<svg viewBox="0 0 32 32"><use href="#badge-${id}"/></svg>`;
    tray.appendChild(el);
  });

  // Auto-scroll to the latest badge on mobile
  tray.scrollLeft = tray.scrollWidth;
}

function showBadgeNotification(badge) {
  const notif = document.createElement('div');
  notif.className = 'badge-notification';
  // Longer descriptions get a longer display time so they can be read
  const isLongDesc = badge.desc.length > 60;
  if (isLongDesc) notif.classList.add('long-desc');

  notif.innerHTML = `
    <div class="unlock-label">★ BADGE UNLOCKED ★</div>
    <div class="unlock-icon">
      <svg viewBox="0 0 32 32" width="100%" height="100%"><use href="#badge-${badge.id}"/></svg>
    </div>
    <div class="unlock-name">${badge.name}</div>
    <div class="unlock-desc">${badge.desc}</div>
  `;
  document.body.appendChild(notif);

  // Extra confetti for badge unlock
  fireConfetti();

  // Remove after animation completes (2.4s normal, 4.2s for long descriptions)
  const duration = isLongDesc ? 4200 : 2400;
  setTimeout(() => notif.remove(), duration);
}

// =============================================
// CONFETTI
// =============================================
function fireConfetti() {
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  document.body.appendChild(layer);

  const colors = ['#ff2e93', '#00f0ff', '#ffd60a', '#39ff14', '#ff8c00', '#ffffff'];
  const count = 60;

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 0.3) + 's';
    piece.style.animationDuration = (1 + Math.random() * 0.8) + 's';
    // Vary shape: some squares, some rectangles
    if (Math.random() > 0.5) {
      piece.style.width = '8px';
      piece.style.height = '8px';
    }
    if (Math.random() > 0.7) {
      piece.style.borderRadius = '50%';
    }
    layer.appendChild(piece);
  }

  setTimeout(() => layer.remove(), 2400);
}

// =============================================
// SCREEN FLASH
// =============================================
function flashScreen(isWrong) {
  const flash = document.createElement('div');
  flash.className = 'flash-overlay' + (isWrong ? ' wrong' : '');
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 700);
}

// =============================================
// REACTION POPUP (thumbs-up kid or sad plant)
// =============================================
function showReaction(isCorrect) {
  const popup = document.createElement('div');
  popup.className = 'reaction-popup';

  const messages = isCorrect
    ? ['NICE!', 'YES!', 'BOOM!', 'GENIUS!', 'CORRECT!', 'EPIC!', '+1 SMART']
    : ['OOF!', 'NOPE!', 'TRY AGAIN!', 'YIKES!', 'CLOSE!', 'WHIFF!'];
  const msg = messages[Math.floor(Math.random() * messages.length)];

  const svgId = isCorrect ? 'art-thumbsup-kid' : 'art-sad-plant';

  popup.innerHTML = `
    <svg viewBox="0 0 80 80"><use href="#${svgId}"/></svg>
    <div class="reaction-text${isCorrect ? '' : ' wrong-text'}">${msg}</div>
  `;

  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1200);
}

// =============================================
// DEFINITION PANEL (shown after wrong answer)
// =============================================
function showDefinitionPanel(q) {
  const correctDisplay = matchCase(q.correctAnswer, q.correctAnswer);
  const panel = document.createElement('div');
  panel.className = 'definition-panel';

  panel.innerHTML = `
    <svg class="panel-art" viewBox="0 0 80 80" aria-hidden="true">
      <use href="#art-sad-plant"/>
    </svg>
    <div class="panel-body">
      <div class="definition-word">${correctDisplay}</div>
      <div class="definition-text">${escapeHtml(q.definition)}</div>
      <button class="next-btn" id="next-q-btn">NEXT QUESTION ▶</button>
    </div>
  `;

  document.getElementById('content').appendChild(panel);

  // Wire up the next button
  document.getElementById('next-q-btn').addEventListener('click', advanceQuestion);
  document.getElementById('next-q-btn').addEventListener('touchend', function() {
    this.blur();
  });

  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// =============================================
// RESULTS SCREEN
// =============================================
function renderResults() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const percent = Math.round((score / total) * 100);

  // Check end-of-quiz badges (survivor, bookworm, master, perfect)
  checkBadges({ justCorrect: false, quizComplete: true });

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').innerHTML = '&gt; GAME OVER';
  document.getElementById('header-sub').textContent = `FINAL: ${score} / ${total}`;

  let grade, message, artId;
  if (percent >= 90) {
    grade = 'HIGH SCORE!';
    message = 'Outstanding command of the vocabulary.';
    artId = 'art-trophy';
  } else if (percent >= 80) {
    grade = 'GREAT JOB!';
    message = 'Strong performance — just a few to review.';
    artId = 'art-trophy';
  } else if (percent >= 70) {
    grade = 'NICE WORK!';
    message = 'Solid understanding. A bit more practice and you\'ve got it.';
    artId = 'art-thumbsup-kid';
  } else if (percent >= 60) {
    grade = 'KEEP GOING!';
    message = 'Getting there — review the missed words and try again.';
    artId = 'art-thumbsup-kid';
  } else {
    grade = 'STUDY TIME!';
    message = 'Hit the books and come back for round two.';
    artId = 'art-sad-plant';
  }

  const content = document.getElementById('content');
  content.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.className = 'results';

  wrapper.innerHTML = `
    <svg class="results-art" viewBox="0 0 80 80" aria-hidden="true"><use href="#${artId}"/></svg>
    <div class="score-display">
      <div class="score-percent">${percent}%</div>
      <div class="score-fraction">${score} of ${total} correct</div>
    </div>
    <div class="grade-label">${grade}</div>
    <div class="grade-message">${message}</div>
    ${quizState.maxStreak >= 5 ? `<div class="grade-message" style="color: var(--neon-pink); font-weight: 600;">🔥 Best streak: ${quizState.maxStreak} in a row!</div>` : ''}
  `;

  if (quizState.wrongAnswers.length === 0) {
    const perfect = document.createElement('div');
    perfect.className = 'perfect-message';
    perfect.textContent = '🎉 PERFECT SCORE! FLAWLESS VICTORY 🎉';
    wrapper.appendChild(perfect);
    // Big celebration for perfect score
    setTimeout(() => fireConfetti(), 200);
    setTimeout(() => fireConfetti(), 600);
    setTimeout(() => fireConfetti(), 1000);
  }

  // Show badges earned summary (if any)
  if (quizState.earnedBadges.length > 0) {
    const badgeSummary = document.createElement('div');
    badgeSummary.className = 'badge-summary';
    let badgeHtml = `<h3>▸ ${quizState.earnedBadges.length} BADGE${quizState.earnedBadges.length === 1 ? '' : 'S'} EARNED</h3><div class="badge-summary-grid">`;
    quizState.earnedBadges.forEach(id => {
      const badge = BADGES.find(b => b.id === id);
      if (!badge) return;
      badgeHtml += `
        <div class="badge-summary-item">
          <div class="badge-summary-icon">
            <svg viewBox="0 0 32 32"><use href="#badge-${id}"/></svg>
          </div>
          <div class="badge-summary-text">
            <div class="badge-summary-name">${badge.name}</div>
            <div class="badge-summary-desc">${badge.desc}</div>
          </div>
        </div>`;
    });
    badgeHtml += '</div>';
    badgeSummary.innerHTML = badgeHtml;
    wrapper.appendChild(badgeSummary);
  }

  if (quizState.wrongAnswers.length > 0) {
    const review = document.createElement('div');
    review.className = 'review-section';
    const h3 = document.createElement('h3');
    h3.textContent = `▸ REVIEW: ${quizState.wrongAnswers.length} MISSED`;
    review.appendChild(h3);

    quizState.wrongAnswers.forEach(w => {
      const item = document.createElement('div');
      item.className = 'review-item';

      const wordTag = document.createElement('div');
      wordTag.className = 'review-word';
      wordTag.textContent = w.word;

      const qText = document.createElement('div');
      qText.className = 'review-question';
      qText.innerHTML = escapeHtml(w.sentence).replace('___', '<strong>_____</strong>');

      const yourAns = document.createElement('div');
      yourAns.className = 'review-answer your-answer';
      yourAns.innerHTML = '<span class="label">Your answer:</span>';
      yourAns.appendChild(document.createTextNode(w.yourAnswer));

      const correctAns = document.createElement('div');
      correctAns.className = 'review-answer correct-answer';
      correctAns.innerHTML = '<span class="label">Correct:</span>';
      correctAns.appendChild(document.createTextNode(w.correctAnswer));

      item.appendChild(wordTag);
      item.appendChild(qText);
      item.appendChild(yourAns);
      item.appendChild(correctAns);

      if (w.definition) {
        const defLine = document.createElement('div');
        defLine.className = 'review-definition';
        const defLabel = document.createElement('span');
        defLabel.className = 'label';
        defLabel.textContent = 'Means:';
        defLine.appendChild(defLabel);
        defLine.appendChild(document.createTextNode(' ' + w.definition));
        item.appendChild(defLine);
      }

      review.appendChild(item);
    });

    wrapper.appendChild(review);
  }

  const restart = document.createElement('button');
  restart.className = 'start-btn';
  restart.textContent = '▶ PLAY AGAIN';
  restart.onclick = startQuiz;
  restart.addEventListener('touchend', function() { this.blur(); });
  wrapper.appendChild(restart);

  content.appendChild(wrapper);
}

// =============================================
// INIT
// =============================================
renderStartScreen();
</script>
