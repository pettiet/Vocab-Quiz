<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-1: #0f172a;
    --bg-2: #1e293b;
    --card: #ffffff;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --correct: #10b981;
    --wrong: #ef4444;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
  }

  .container {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 720px;
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 28px 32px;
  }

  .header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .header p {
    opacity: 0.9;
    font-size: 0.95rem;
  }

  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    margin-top: 16px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: white;
    width: 0%;
    transition: width 0.4s ease;
    border-radius: 4px;
  }

  .progress-text {
    font-size: 0.85rem;
    margin-top: 8px;
    opacity: 0.9;
  }

  .content {
    padding: 36px 32px;
  }

  .vocab-word {
    display: inline-block;
    background: #eef2ff;
    color: var(--primary-dark);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
  }

  .question {
    font-size: 1.25rem;
    line-height: 1.6;
    margin-bottom: 28px;
    color: var(--text);
  }

  .blank {
    display: inline-block;
    min-width: 80px;
    border-bottom: 2px solid var(--primary);
    margin: 0 4px;
    text-align: center;
    font-weight: 600;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    background: #f8fafc;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 1rem;
    text-align: left;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option:hover:not(:disabled) {
    border-color: var(--primary);
    background: #eef2ff;
    transform: translateX(4px);
  }

  .option-letter {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    border: 2px solid var(--border);
    font-weight: 600;
    font-size: 0.85rem;
    flex-shrink: 0;
  }

  .option.correct {
    background: #d1fae5;
    border-color: var(--correct);
    color: #065f46;
  }

  .option.correct .option-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }

  .option.wrong {
    background: #fee2e2;
    border-color: var(--wrong);
    color: #991b1b;
  }

  .option.wrong .option-letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: white;
  }

  .option:disabled {
    cursor: not-allowed;
  }

  .results {
    text-align: center;
    padding: 20px 0;
  }

  .score-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    color: white;
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
  }

  .score-percent {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1;
  }

  .score-fraction {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-top: 4px;
  }

  .grade-label {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .grade-message {
    color: var(--text-light);
    margin-bottom: 28px;
  }

  .review-section {
    margin-top: 32px;
    text-align: left;
  }

  .review-section h3 {
    font-size: 1.15rem;
    margin-bottom: 16px;
    color: var(--text);
  }

  .review-item {
    background: #f8fafc;
    border-left: 4px solid var(--wrong);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 12px;
  }

  .review-question {
    font-size: 0.95rem;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .review-word {
    display: inline-block;
    background: #eef2ff;
    color: var(--primary-dark);
    padding: 2px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .review-answer {
    font-size: 0.9rem;
    margin-top: 6px;
  }

  .review-answer.your-answer {
    color: var(--wrong);
  }

  .review-answer.correct-answer {
    color: var(--correct);
    font-weight: 600;
  }

  .review-answer .label {
    font-weight: 600;
    color: var(--text-light);
    margin-right: 6px;
  }

  .perfect-message {
    background: #d1fae5;
    border-left: 4px solid var(--correct);
    color: #065f46;
    padding: 20px;
    border-radius: 8px;
    font-size: 1rem;
    text-align: center;
  }

  .restart-btn {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    border: none;
    padding: 14px 36px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 24px;
    transition: transform 0.2s;
    font-family: inherit;
  }

  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
  }

  .start-screen {
    text-align: center;
    padding: 20px 0;
  }

  .start-screen h2 {
    font-size: 1.5rem;
    margin-bottom: 12px;
  }

  .start-screen p {
    color: var(--text-light);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .stat-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 24px 0;
    flex-wrap: wrap;
  }

  .stat {
    background: #f1f5f9;
    padding: 16px 24px;
    border-radius: 12px;
    min-width: 120px;
  }

  .stat-number {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--primary);
  }

  .stat-label {
    font-size: 0.85rem;
    color: var(--text-light);
    margin-top: 2px;
  }

  @media (max-width: 600px) {
    .header { padding: 20px 24px; }
    .content { padding: 24px 20px; }
    .header h1 { font-size: 1.4rem; }
    .question { font-size: 1.1rem; }
    .option { padding: 14px 16px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📚 Vocabulary Quiz</h1>
    <p id="header-sub">Test your knowledge — 64 questions</p>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text">Ready to begin</div>
  </div>

  <div class="content" id="content"></div>
</div>

// Decode helper
function d(str) {
  try { return decodeURIComponent(escape(atob(str))); }
  catch(e) { return atob(str); }
}

let quizState = {
  questions: [],
  currentIndex: 0,
  score: 0,
  wrongAnswers: []
};

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function matchCase(template, replacement) {
  if (template.length > 0 && template[0] === template[0].toUpperCase() && template[0] !== template[0].toLowerCase()) {
    return replacement.charAt(0).toUpperCase() + replacement.slice(1);
  }
  return replacement.toLowerCase();
}

function buildQuiz() {
  const selected = ENCODED_BANK.map(entry => {
    // Pick one of the question versions at random and decode it
    const versionIndex = Math.floor(Math.random() * entry.q.length);
    const q = entry.q[versionIndex];

    const decodedSentence = d(q.s);
    const decodedCorrect = d(q.c);
    const decodedOptions = q.o.map(o => d(o));

    // Shuffle decoded options at render time (extra entropy)
    const shuffledOptions = shuffleArray(decodedOptions);

    return {
      word: entry.w,
      sentence: decodedSentence,
      options: shuffledOptions,
      correctAnswer: decodedCorrect
    };
  });

  quizState.questions = shuffleArray(selected);
  quizState.currentIndex = 0;
  quizState.score = 0;
  quizState.wrongAnswers = [];
}

function renderStartScreen() {
  document.getElementById('header-sub').textContent = `Test your knowledge — ${ENCODED_BANK.length} questions`;
  document.getElementById('progress-text').textContent = 'Ready to begin';
  document.getElementById('progress-fill').style.width = '0%';

  document.getElementById('content').innerHTML = `
    <div class="start-screen">
      <h2>Ready to test your vocabulary?</h2>
      <p>You'll get one question per word — fill in the blank with the best answer.<br>Questions and answer order are randomized each time.</p>
      <div class="stat-row">
        <div class="stat">
          <div class="stat-number">${ENCODED_BANK.length}</div>
          <div class="stat-label">Questions</div>
        </div>
        <div class="stat">
          <div class="stat-number">4</div>
          <div class="stat-label">Choices each</div>
        </div>
      </div>
      <button class="restart-btn" onclick="startQuiz()">Start Quiz</button>
    </div>
  `;
}

function startQuiz() {
  buildQuiz();
  renderQuestion();
}

function renderQuestion() {
  const q = quizState.questions[quizState.currentIndex];
  const progress = ((quizState.currentIndex) / quizState.questions.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';
  document.getElementById('progress-text').textContent =
    `Question ${quizState.currentIndex + 1} of ${quizState.questions.length}`;
  document.getElementById('header-sub').textContent =
    `Score: ${quizState.score} / ${quizState.currentIndex}`;

  const container = document.createElement('div');

  const sentenceDiv = document.createElement('div');
  sentenceDiv.className = 'question';
  sentenceDiv.innerHTML = escapeHtml(q.sentence).replace('___', '<span class="blank">_____</span>');
  container.appendChild(sentenceDiv);

  const optionsDiv = document.createElement('div');
  optionsDiv.className = 'options';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    const displayOpt = matchCase(q.correctAnswer, opt);

    const letterSpan = document.createElement('span');
    letterSpan.className = 'option-letter';
    letterSpan.textContent = String.fromCharCode(65 + i);

    const textSpan = document.createElement('span');
    textSpan.className = 'option-text';
    textSpan.textContent = displayOpt;

    btn.appendChild(letterSpan);
    btn.appendChild(textSpan);

    // Attach the actual option value via a closure, not as a DOM attribute,
    // so it doesn't appear in the rendered HTML
    btn.addEventListener('click', () => selectAnswer(btn, opt));

    optionsDiv.appendChild(btn);
  });

  container.appendChild(optionsDiv);

  const content = document.getElementById('content');
  content.innerHTML = '';
  content.appendChild(container);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectAnswer(button, selectedOption) {
  const q = quizState.questions[quizState.currentIndex];
  const allButtons = document.querySelectorAll('.option');
  allButtons.forEach(b => b.disabled = true);

  const isCorrect = selectedOption.toLowerCase() === q.correctAnswer.toLowerCase();

  if (isCorrect) {
    button.classList.add('correct');
    quizState.score++;
  } else {
    button.classList.add('wrong');
    // Highlight the correct answer by matching its text content
    const correctDisplay = matchCase(q.correctAnswer, q.correctAnswer);
    allButtons.forEach(b => {
      const text = b.querySelector('.option-text').textContent;
      if (text === correctDisplay) {
        b.classList.add('correct');
      }
    });
    quizState.wrongAnswers.push({
      word: q.word,
      sentence: q.sentence,
      yourAnswer: matchCase(q.correctAnswer, selectedOption),
      correctAnswer: matchCase(q.correctAnswer, q.correctAnswer)
    });
  }

  setTimeout(() => {
    quizState.currentIndex++;
    if (quizState.currentIndex >= quizState.questions.length) {
      renderResults();
    } else {
      renderQuestion();
    }
  }, isCorrect ? 700 : 1400);
}

function renderResults() {
  const total = quizState.questions.length;
  const score = quizState.score;
  const percent = Math.round((score / total) * 100);

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-text').textContent = 'Quiz complete!';
  document.getElementById('header-sub').textContent = `Final score: ${score} / ${total}`;

  let grade, message;
  if (percent >= 90) { grade = 'Excellent! 🌟'; message = 'Outstanding command of vocabulary.'; }
  else if (percent >= 80) { grade = 'Great Job! 👏'; message = 'Strong performance — just a few to review.'; }
  else if (percent >= 70) { grade = 'Good Work! 👍'; message = 'Solid understanding with some room to grow.'; }
  else if (percent >= 60) { grade = 'Keep Practicing! 💪'; message = "You're getting there — review and try again."; }
  else { grade = 'Time to Study! 📖'; message = 'Review the missed words and give it another go.'; }

  const content = document.getElementById('content');
  content.innerHTML = '';

  const wrapper = document.createElement('div');
  wrapper.className = 'results';

  wrapper.innerHTML = `
    <div class="score-circle">
      <div class="score-percent">${percent}%</div>
      <div class="score-fraction">${score} / ${total}</div>
    </div>
    <div class="grade-label">${grade}</div>
    <div class="grade-message">${message}</div>
  `;

  if (quizState.wrongAnswers.length === 0) {
    const perfect = document.createElement('div');
    perfect.className = 'perfect-message';
    perfect.textContent = '🎉 Perfect score! Every answer was correct.';
    wrapper.appendChild(perfect);
  } else {
    const review = document.createElement('div');
    review.className = 'review-section';
    const h3 = document.createElement('h3');
    h3.textContent = `Review missed questions (${quizState.wrongAnswers.length})`;
    review.appendChild(h3);

    quizState.wrongAnswers.forEach(w => {
      const item = document.createElement('div');
      item.className = 'review-item';

      const wordTag = document.createElement('div');
      wordTag.className = 'review-word';
      wordTag.textContent = w.word;

      const qText = document.createElement('div');
      qText.className = 'review-question';
      qText.innerHTML = escapeHtml(w.sentence).replace('___', '<strong>_____</strong>');

      const yourAns = document.createElement('div');
      yourAns.className = 'review-answer your-answer';
      yourAns.innerHTML = '<span class="label">Your answer:</span>';
      yourAns.appendChild(document.createTextNode(w.yourAnswer));

      const correctAns = document.createElement('div');
      correctAns.className = 'review-answer correct-answer';
      correctAns.innerHTML = '<span class="label">Correct answer:</span>';
      correctAns.appendChild(document.createTextNode(w.correctAnswer));

      item.appendChild(wordTag);
      item.appendChild(qText);
      item.appendChild(yourAns);
      item.appendChild(correctAns);
      review.appendChild(item);
    });

    wrapper.appendChild(review);
  }

  const restart = document.createElement('button');
  restart.className = 'restart-btn';
  restart.textContent = 'Try Again with New Questions';
  restart.onclick = startQuiz;
  wrapper.appendChild(restart);

  content.appendChild(wrapper);
}

renderStartScreen();
</script>
